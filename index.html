<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Azure Coast — 3D Master Plan</title>
<style>
  :root {
    --ink: #1c2b33;
    --paper: #f4efe6;
    --accent: #2e6f6a;
    --panel-w: 400px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- loading splash ---------- */
  #splash {
    position: fixed; inset: 0; z-index: 50;
    background: #948a6e;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .9s ease;
  }
  #splash.hidden { opacity: 0; pointer-events: none; }
  #splash h1 {
    color: #f6f2e9; font-family: Georgia, "Times New Roman", serif;
    font-weight: 500; font-size: 34px; letter-spacing: .35em; text-indent: .35em;
  }

  /* ---------- header ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: flex-end;
    padding: 22px 36px; pointer-events: none;
  }
  header .brand {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-family: Georgia, serif; font-size: 24px; letter-spacing: .3em;
    text-indent: .3em; color: #fff; text-shadow: 0 1px 12px rgba(60,45,20,.25);
  }
  header .note {
    pointer-events: auto; font-size: 10px; letter-spacing: .08em;
    color: rgba(255,255,255,.85); text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(60,45,20,.3);
  }
  body.night header .brand, body.night header .note { color: #dfe8f2; }

  /* ---------- pins ---------- */
  #pins { position: fixed; inset: 0; z-index: 10; pointer-events: none; overflow: hidden; }
  .pin {
    position: absolute; transform: translate(-50%, -100%);
    pointer-events: auto; cursor: pointer; user-select: none;
    display: flex; flex-direction: column; align-items: center;
    transition: opacity .25s ease;
  }
  .pin .head {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 4px;
    transform: rotate(-45deg);
    background: #274a63; border: 2px solid rgba(255,255,255,.9);
    box-shadow: 0 4px 14px rgba(30,40,60,.35);
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, transform .2s;
  }
  .pin .head span { transform: rotate(45deg); color: #fff; font-size: 13px; line-height: 1; }
  .pin:hover .head, .pin.active .head { background: #d99a4e; transform: rotate(-45deg) scale(1.15); }
  .pin .label {
    margin-top: 7px; background: rgba(255,255,255,.96); color: var(--ink);
    padding: 8px 14px; border-radius: 2px; text-align: center;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    box-shadow: 0 6px 20px rgba(60,45,20,.18);
    opacity: 0; transform: translateY(-4px); transition: opacity .2s, transform .2s;
    white-space: nowrap;
  }
  .pin .label small { display: block; margin-top: 3px; color: #8a8577; font-size: 9px; letter-spacing: .12em; }
  .pin:hover .label, .pin.active .label { opacity: 1; transform: translateY(0); }

  /* ---------- side panel ---------- */
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel-w);
    max-width: 92vw; z-index: 30; background: #f4efe6;
    box-shadow: -20px 0 60px rgba(40,30,10,.25);
    transform: translateX(105%); transition: transform .5s cubic-bezier(.22,1,.36,1);
    display: flex; flex-direction: column;
  }
  #panel.open { transform: translateX(0); }
  #panel .visual { height: 38%; min-height: 220px; position: relative; }
  #panel .visual .art { position: absolute; inset: 0; }
  #panel .close {
    position: absolute; top: 18px; left: -66px; width: 48px; height: 48px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.7);
    background: rgba(30,40,55,.35); color: #fff; font-size: 18px;
    cursor: pointer; backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .3s ease .2s;
  }
  #panel.open .close { opacity: 1; pointer-events: auto; }
  #panel .body { padding: 34px 38px; overflow-y: auto; }
  #panel .body .year {
    font-size: 10px; letter-spacing: .22em; color: #8a8577; text-transform: uppercase;
  }
  #panel .body h2 {
    font-family: Georgia, serif; font-weight: 500; font-size: 30px;
    letter-spacing: .06em; margin: 14px 0 16px;
  }
  #panel .body p { font-size: 12.5px; line-height: 1.85; letter-spacing: .05em; color: #4a463c; text-transform: uppercase; }
  #panel .body .cta {
    display: inline-block; margin-top: 30px; padding-bottom: 6px;
    color: var(--accent); font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    text-decoration: none; border-bottom: 1px solid var(--accent);
  }
  body.night #panel { background: #17202b; color: #e8ecf2; }
  body.night #panel .body p { color: #aab4c0; }
  body.night #panel .body h2 { color: #f0f3f7; }

  /* ---------- bottom controls ---------- */
  #controls {
    position: fixed; left: 28px; bottom: 24px; z-index: 20;
    display: flex; gap: 12px;
  }
  #controls button {
    width: 52px; height: 52px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.75);
    background: rgba(255,255,255,.22); backdrop-filter: blur(8px);
    color: #fff; font-size: 18px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(60,45,20,.18);
    transition: background .2s;
  }
  #controls button:hover { background: rgba(255,255,255,.45); }
  #controls button.on { background: #1e2f42; border-color: #1e2f42; }

  #hint {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    z-index: 20; color: rgba(255,255,255,.9); font-size: 10px;
    letter-spacing: .18em; text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(60,45,20,.35); pointer-events: none;
    transition: opacity 1s ease;
  }
  #hint.hidden { opacity: 0; }

  /* ---------- mobile: panel becomes a bottom sheet ---------- */
  @media (max-width: 768px) {
    header { padding: 16px 18px; }
    header .brand { font-size: 17px; }
    header .note { display: none; }
    #hint { font-size: 9px; bottom: 80px; white-space: nowrap; }

    #panel {
      top: auto; left: 0; right: 0; bottom: 0;
      width: 100%; max-width: none;
      height: 62vh; height: 62dvh;
      border-radius: 18px 18px 0 0;
      transform: translateY(110%);
      box-shadow: 0 -18px 50px rgba(20,15,5,.35);
    }
    #panel.open { transform: translateY(0); }
    #panel .visual { height: 34%; min-height: 140px; border-radius: 18px 18px 0 0; overflow: hidden; }
    #panel .close { left: auto; right: 14px; top: 14px; width: 42px; height: 42px; }
    #panel .body { padding: 22px 24px 36px; }
    #panel .body h2 { font-size: 23px; margin: 10px 0 12px; }

    #controls { left: 16px; bottom: 16px; }
    #controls button { width: 46px; height: 46px; font-size: 16px; }

    /* the sheet already shows the residence info — floating pins on the
       sliver of visible map just add clutter and clash with the header */
    body.panel-open .pin { opacity: 0 !important; pointer-events: none !important; }
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="splash"><h1>AZURE COAST</h1></div>

  <header>
    <div class="brand">AZURE COAST</div>
    <div class="note">Procedural demo &mdash; no 3D assets</div>
  </header>

  <div id="pins"></div>

  <aside id="panel">
    <div class="visual"><div class="art" id="panel-art"></div>
      <button class="close" id="panel-close" aria-label="Close">&#10005;</button>
    </div>
    <div class="body">
      <div class="year" id="panel-year"></div>
      <h2 id="panel-title"></h2>
      <p id="panel-desc"></p>
      <a class="cta" href="#">Get the presentation &nbsp;&rsaquo;</a>
    </div>
  </aside>

  <div id="controls">
    <button id="btn-day" class="on" title="Day">&#9728;</button>
    <button id="btn-night" title="Night">&#9789;</button>
  </div>

  <div id="hint">Drag to orbit &middot; scroll to zoom &middot; click a pin</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
